// Picking usa só o SUBTYPE pick_to_ship (picking_continuous e picking literal
// ficam de fora — validado por reconciliação manual contra o dashboard de
// referência do time guilherme). Operado só pelo time do Guilherme.
const PROCESSES = [
  { key: "pick_to_ship", label: "Picking", meta: 82.21 },
  { key: "hu_assembly", label: "HU Assembly", meta: 156.85 },
  { key: "packing", label: "Packing", meta: 151.24 }
];
const PROC_TEAM_OVERRIDE = { pick_to_ship: ["guilherme"] };

const STATE = { proc: "pick_to_ship" };
let opChart = null;

function hourSortKey(hr) {
  return hr === 23 ? -1 : hr; // 23h vem antes de 0h, 1h, 2h...
}
function fmtHour(hr) {
  return String(hr).padStart(2, "0") + "h";
}
function sumRows(filterFn) {
  let units = 0, sysH = 0;
  for (const r of ROWS) if (filterFn(r)) { units += r.units; sysH += r.sys_h; }
  return { units, sysH };
}
function isDark() {
  return document.documentElement.classList.contains("dark");
}
function cssVar(name) {
  return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
}

// Célula "líquida" no estilo do dashboard do Guilherme: taxa da hora em cima
// (unidades ÷ horas sistêmicas daquela hora, colorida vs. meta) e unidades
// brutas embaixo, menor e apagado. "—" = colaborador não teve registro nessa
// hora. "." = teve registro mas horas sistêmicas desprezíveis (<0.05h).
function fmtHourCell(hasRecord, units, sysH, meta) {
  if (!hasRecord) {
    return `<div class="hr-cell empty-hr"><span class="hr-rate rate-none">—</span></div>`;
  }
  if (sysH < 0.05) {
    return `<div class="hr-cell"><span class="hr-rate rate-none">.</span><span class="hr-units">${units}</span></div>`;
  }
  const rate = Math.round(units / sysH);
  let cls = "rate-mid";
  if (rate >= meta) cls = "rate-good";
  else if (rate < meta * 0.6) cls = "rate-bad";
  return `<div class="hr-cell"><span class="hr-rate ${cls}">${rate}</span><span class="hr-units">${units}</span></div>`;
}

function renderChart() {
  const canvas = document.getElementById("opChart");
  const ctx = canvas.getContext("2d");
  if (opChart) { opChart.destroy(); opChart = null; }

  const textColor = cssVar("--chart-text") || "#444";
  const gridColor = cssVar("--chart-grid") || "#e5e5e0";

  const labels = PROCESSES.map(p => p.label);
  const palette = ["#3483FA", "#f5a623"];
  const datasets = Object.entries(TEAMS).map(([teamKey, team], i) => {
    const data = PROCESSES.map(p => {
      const teamsAllowed = PROC_TEAM_OVERRIDE[p.key];
      if (teamsAllowed && !teamsAllowed.includes(teamKey)) return null;
      const { units, sysH } = sumRows(r => r.time_lider === teamKey && r.proc === p.key);
      const rate = sysH > 0 ? units / sysH : 0;
      return Math.round((rate / p.meta) * 1000) / 10;
    });
    return { type: "bar", label: team.label, data, backgroundColor: palette[i % palette.length] };
  });
  datasets.push({
    type: "line", label: "Meta (100%)", data: labels.map(() => 100),
    borderColor: "#e5484d", borderDash: [6, 4], pointRadius: 0, borderWidth: 2
  });

  // Rótulo de dados desenhado manualmente em cima de cada barra (sem plugin externo)
  const barValueLabels = {
    id: "barValueLabels",
    afterDatasetsDraw(chart) {
      const { ctx } = chart;
      chart.data.datasets.forEach((dataset, i) => {
        if (dataset.type !== "bar") return;
        const meta = chart.getDatasetMeta(i);
        meta.data.forEach((bar, idx) => {
          const value = dataset.data[idx];
          if (value === null || value === undefined) return;
          ctx.save();
          ctx.fillStyle = textColor;
          ctx.font = "600 11px -apple-system, Segoe UI, Roboto, sans-serif";
          ctx.textAlign = "center";
          ctx.textBaseline = "bottom";
          ctx.fillText(value.toFixed(1) + "%", bar.x, bar.y - 4);
          ctx.restore();
        });
      });
    }
  };

  opChart = new Chart(ctx, {
    data: { labels, datasets },
    options: {
      responsive: true, maintainAspectRatio: false,
      layout: { padding: { top: 18 } },
      scales: {
        y: { beginAtZero: true, title: { display: true, text: "% da meta", color: textColor }, ticks: { color: textColor }, grid: { color: gridColor } },
        x: { ticks: { color: textColor }, grid: { color: gridColor } }
      },
      plugins: { legend: { position: "bottom", labels: { color: textColor } } }
    },
    plugins: [barValueLabels]
  });
}

function renderProcSection(proc, teamKey, team) {
  // horas com algum registro nesse time+processo
  const hourSet = new Set(ROWS.filter(r => r.time_lider === teamKey && r.proc === proc.key).map(r => r.hr));
  const hours = [...hourSet].sort((a, b) => hourSortKey(a) - hourSortKey(b));

  // linhas por colaborador (oculta quem está zerado em todas as horas = folga)
  let people = team.roster.map(person => {
    const byHour = hours.map(hr => {
      const row = ROWS.find(r => r.time_lider === teamKey && r.proc === proc.key && r.ldap === person.ldap && r.hr === hr);
      return { hasRecord: !!row, units: row ? row.units : 0, sysH: row ? row.sys_h : 0 };
    });
    const { units: totalUnits, sysH: totalSysH } = sumRows(r => r.time_lider === teamKey && r.proc === proc.key && r.ldap === person.ldap);
    const semAtividade = totalUnits === 0 && totalSysH === 0;
    const media = totalSysH >= 0.10 ? Math.round((totalUnits / totalSysH) * 10) / 10 : null;
    return { person, byHour, totalUnits, media, semAtividade };
  });
  const hiddenCount = people.filter(x => x.semAtividade).length;
  people = people.filter(x => !x.semAtividade);
  people.sort((a, b) => b.totalUnits - a.totalUnits);

  const section = document.createElement("div");
  section.className = "hour-section";

  let html = `<h3>${team.label} — ${proc.label}${hiddenCount ? ` <span style="font-weight:400;color:var(--muted2);font-size:12px;">(${hiddenCount} sem atividade / folga, ocultos)</span>` : ""}</h3>`;

  if (hours.length === 0) {
    html += `<div style="color:var(--muted2); font-size:13px;">Sem registros no turno para este processo.</div>`;
    section.innerHTML = html;
    return section;
  }

  html += `
    <table class="hour-table">
      <thead>
        <tr>
          <th>Representante</th>
          ${hours.map(hr => `<th>${fmtHour(hr)}</th>`).join("")}
          <th>Med. líquida</th>
          <th>Total un.</th>
        </tr>
      </thead>
      <tbody>
  `;
  for (const x of people) {
    const cls = x.person.afastado ? "afastado" : "";
    html += `<tr class="${cls}"><td class="nome-cell">${x.person.nome}${x.person.afastado ? ' <span class="badge">afastado</span>' : ""}</td>`;
    html += x.byHour.map(h => `<td>${fmtHourCell(h.hasRecord, h.units, h.sysH, proc.meta)}</td>`).join("");
    html += `<td>${x.media === null ? "—" : x.media.toFixed(0)}</td><td>${x.totalUnits}</td></tr>`;
  }

  // linha de totais do time (soma por hora)
  const totalsByHour = hours.map(hr => {
    return sumRows(r => r.time_lider === teamKey && r.proc === proc.key && r.hr === hr);
  });
  const { units: grandTotal, sysH: grandSysH } = sumRows(r => r.time_lider === teamKey && r.proc === proc.key);
  const grandMedia = grandSysH >= 0.10 ? Math.round((grandTotal / grandSysH) * 10) / 10 : null;

  html += `<tr class="total-row"><td>Total do time</td>`;
  html += totalsByHour.map(t => `<td>${fmtHourCell(t.sysH > 0 || t.units > 0, t.units, t.sysH, proc.meta)}</td>`).join("");
  html += `<td>${grandMedia === null ? "—" : grandMedia.toFixed(0)}</td><td>${grandTotal}</td></tr>`;

  html += `</tbody></table>`;
  section.innerHTML = html;
  return section;
}

function render() {
  const banner = document.getElementById("shiftBanner");
  banner.textContent = SHIFT.label;
  banner.className = "shift-banner" + (SHIFT.active ? " active" : "");

  const procsToShow = [PROCESSES.find(p => p.key === STATE.proc)];

  const hourSectionsEl = document.getElementById("hourSections");
  hourSectionsEl.innerHTML = "";

  for (const proc of procsToShow) {
    const teamsToRender = PROC_TEAM_OVERRIDE[proc.key] || Object.keys(TEAMS);
    for (const [teamKey, team] of Object.entries(TEAMS)) {
      if (!teamsToRender.includes(teamKey)) continue;
      hourSectionsEl.appendChild(renderProcSection(proc, teamKey, team));
    }
  }

  renderChart();

  const gen = new Date(GENERATED_AT);
  document.getElementById("lastUpdated").textContent =
    "Gerado às " + gen.toLocaleTimeString("pt-BR") + " (BRT)";
  const metasTexto = procsToShow.map(p => `${p.label}: ${p.meta} un/h`).join(" · ");
  document.getElementById("footnote").textContent =
    `Meta — ${metasTexto}. "Média/h" = unidades ÷ horas sistêmicas trabalhadas (não é a mesma coisa que ÷ nº de colunas de hora). Quem está zerado em todas as horas não aparece — entendido como folga. Atualizado a cada ~10 min por tarefa agendada — reabra o painel pra ver a versão mais recente.`;
}

function setupFilters() {
  document.querySelectorAll("[data-proc]").forEach(btn => {
    if (btn.dataset.proc === STATE.proc) btn.classList.add("active");
    btn.addEventListener("click", () => {
      STATE.proc = btn.dataset.proc;
      document.querySelectorAll("[data-proc]").forEach(b => b.classList.toggle("active", b === btn));
      render();
    });
  });
}

function setupThemeToggle() {
  const btn = document.getElementById("themeToggle");
  btn.addEventListener("click", () => {
    const dark = document.documentElement.classList.toggle("dark");
    btn.textContent = dark ? "☀️ Modo claro" : "🌙 Modo escuro";
    renderChart(); // recarrega cores do gráfico pro tema atual
  });
}

setupFilters();
setupThemeToggle();
render();
</script>
